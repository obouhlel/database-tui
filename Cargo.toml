[package]
name = "pgtui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Keyboard-driven PostgreSQL client for the terminal"
readme = "README.md"
license = "Unlicense"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "signal"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.3"
uuid = { version = "1.29.2", features = ["v4"] }
webpki-roots = "1.0.12"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
