# Demo / integration-test database for pgtui.
#   docker compose up -d        # start (data loaded on first start)
#   docker compose down -v      # stop and wipe
services:
  postgres:
    image: postgres:18-alpine
    container_name: pgtui-demo
    environment:
      POSTGRES_USER: pgtui
      POSTGRES_PASSWORD: pgtui
      POSTGRES_DB: demo
    ports:
      - "5433:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgtui -d demo"]
      interval: 2s
      timeout: 3s
      retries: 30
